[project]
authors = [{ name = "Rafał Krupiński", email = "rafal@lapidary.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]
description = "Python async OpenAPI client library"
dynamic = ["dependencies"]
license = "MIT"
name = "lapidary"
readme = "Readme.md"
requires-python = ">=3.9"
version = "0.12.3"

[project.urls]
Homepage = "https://lapidary.dev/"
Changelog = "https://github.com/python-lapidary/lapidary/blob/develop/ChangeLog.md"

[tool.poetry]
packages = [{ include = "lapidary", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9"
httpx = { extras = ["http2"], version = "^0.28" }
httpx-auth = "^0.23"
pydantic = "^2.11"
python-mimeparse = "^2"
typing-extensions = "^4.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^1.1"
starlette = "^0.47"

[build-system]
requires = ["poetry-core>=2.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    "tests"
]
addopts = "--color=yes"

[tool.mypy]
mypy_path = "src"
namespace_packages = true
python_version = "3.9"
packages = ["lapidary.runtime"]

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
#extend-select = ["E501", "E4", "E7", "E9", "F", "B", 'UP', 'D']
select = ['F', 'E', 'W', 'C90', 'I', 'UP']
ignore = ['F842', 'UP007']

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lapidary.runtime"]
known-local-folder = ["src"]
