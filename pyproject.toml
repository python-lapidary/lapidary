[project]
authors = [{ name = "Rafał Krupiński", email = "rafal@lapidary.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
]
dependencies = [
    "httpx[http2]==0.28.1",
    "httpx-auth==0.23.1",
    "pydantic>=2.12,<3.0",
    "python-mimeparse>=2,<3",
    "typing-extensions>=4.15,<5.0",
]
description = "Python async OpenAPI client library"
dynamic = ["dependencies"]
license = "MIT"
name = "lapidary"
readme = "Readme.md"
requires-python = ">=3.10"
version = "0.12.3"

[dependency-groups]
docs = [
    "markdown-callouts>=0.4.0",
    "markdown-exec>=1.11.0,<2",
    "mkdocs>=1.6.1,<2",
    "mkdocs-coverage>=2,<3",
    "mkdocs-llmstxt>=0.4.0",
    "mkdocs-material>=9,<10",
    "mkdocs-minify-plugin==0.8.0",
    "mkdocs-section-index==0.3.10",
    "mkdocstrings[python]>=1,<2",
]
test = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.2,<2",
    "starlette==0.50.0",
]

[project.urls]
Homepage = "https://lapidary.dev/"
Changelog = "https://github.com/python-lapidary/lapidary/blob/develop/ChangeLog.md"

[tool.poetry]
packages = [{ include = "lapidary", from = "src" }]

[build-system]
requires = ["poetry-core>=2.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = [
    "src",
    "tests"
]
addopts = "--color=yes"

[tool.mypy]
mypy_path = "src"
namespace_packages = true
python_version = "3.10"
packages = ["lapidary.runtime"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
#extend-select = ["E501", "E4", "E7", "E9", "F", "B", 'UP', 'D']
select = ['F', 'E', 'W', 'C90', 'I', 'UP']
ignore = ['F842', 'UP007']

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["lapidary.runtime"]
known-local-folder = ["src"]
